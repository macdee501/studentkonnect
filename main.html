
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-100 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-6">

            <div class="flex items-center justify-between h-18">

                <!-- Logo -->
                <a href="index.html"
                   class="flex items-center gap-2">

                    <div class="bg-blue-600 text-white p-2 rounded-lg">
                        <svg class="w-5 h-5"
                             fill="none"
                             stroke="currentColor"
                             viewBox="0 0 24 24">
                            <path stroke-linecap="round"
                                  stroke-linejoin="round"
                                  stroke-width="2"
                                  d="M12 2l8 5v10l-8 5-8-5V7l8-5z"/>
                        </svg>
                    </div>

                    <span class="text-xl font-bold text-slate-900">
                        Student<span class="text-blue-600">Konnect</span>
                    </span>
                </a>

                <!-- Desktop Links -->
                <div class="hidden md:flex items-center gap-8">

                    <a href="main.html"
                       class="text-slate-600 hover:text-blue-600 transition">
                        Home
                    </a>

                    <a href="about.html"
                       class="text-slate-600 hover:text-blue-600 transition">
                        About
                    </a>

                    <a href="contact.html"
                       class="text-slate-600 hover:text-blue-600 transition">
                        Contact
                    </a>

                </div>

                <!-- Desktop Auth Buttons -->
                <div class="hidden md:flex items-center gap-4">

                    <a href="signUp.html"
                       class="text-slate-700 hover:text-blue-600 font-medium transition">
                        Sign Up
                    </a>

                    <a href="signIn.html"
                       class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg font-medium transition">
                        Sign In
                    </a>

                </div>

                <!-- Mobile Menu Button -->
                <button
                    id="menuBtn"
                    type="button"
                    aria-label="Toggle navigation menu"
                    aria-controls="mobileMenu"
                    aria-expanded="false"
                    class="md:hidden text-slate-700 p-2 rounded-lg hover:bg-slate-100 cursor-pointer"
                >
                    <svg class="w-6 h-6"
                         fill="none"
                         stroke="currentColor"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>

            </div>

            <!-- Mobile Menu -->
            <div id="mobileMenu"
                 class="hidden md:hidden pb-5 border-t border-slate-100">

                <div class="flex flex-col gap-2 pt-4">

                    <a href="index.html"
                       class="px-3 py-2 text-slate-700 hover:bg-blue-50 hover:text-blue-600 rounded-lg">
                        Home
                    </a>

                    <a href="about.html"
                       class="px-3 py-2 text-slate-700 hover:bg-blue-50 hover:text-blue-600 rounded-lg">
                        About
                    </a>

                    <a href="contact.html"
                       class="px-3 py-2 text-slate-700 hover:bg-blue-50 hover:text-blue-600 rounded-lg">
                        Contact
                    </a>

                    <a href="signUp.html"
                       class="px-3 py-2 text-slate-700 hover:bg-blue-50 rounded-lg">
                        Sign Up
                    </a>

                    <a href="signIn.html"
                       class="bg-blue-600 text-white text-center px-4 py-3 rounded-lg mt-2">
                        Sign In
                    </a>

                </div>
            </div>

        </div>
    </nav>

    <!-- Page Content -->
    <main class="max-w-7xl mx-auto px-6 py-16">
        <h1 class="text-3xl font-bold text-slate-900">
            Welcome to Student Konnect
        </h1>

        <p class="text-slate-500 mt-3">
            Your page content goes here.
        </p>
    </main>

    <!-- Mobile Menu JavaScript -->
    <script>
        const menuBtn = document.getElementById("menuBtn");
        const mobileMenu = document.getElementById("mobileMenu");

        menuBtn.addEventListener("click", function () {
            const isHidden = mobileMenu.classList.toggle("hidden");
            menuBtn.setAttribute("aria-expanded", String(!isHidden));
        });
    </script>

</body>
</html>
