
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>

    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">

    <form
        class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-200"
    >

        <!-- Icon -->
        <div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center mb-6">
            <svg class="w-6 h-6 text-blue-600"
                 fill="none"
                 stroke="currentColor"
                 viewBox="0 0 24 24">
                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M12 15v2m-6 4h12a2 2 0 002-2v-7a2 2 0 00-2-2H4a2 2 0 00-2 2v7a2 2 0 002 2zM8 10V7a4 4 0 118 0v3"/>
            </svg>
        </div>

        <!-- Header -->
        <h1 class="text-3xl font-bold text-slate-900">
            Welcome back
        </h1>

        <p class="text-slate-500 mt-2 mb-8">
            Sign in to your account to continue.
        </p>

        <!-- Username -->
        <div class="mb-5">
            <label for="username"
                   class="block text-sm font-medium text-slate-700 mb-2">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                autocomplete="username"
                required
                class="w-full px-4 py-3 rounded-lg border border-slate-300 bg-slate-50 text-slate-900 placeholder:text-slate-400 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition"
            />
        </div>

        <!-- Password -->
        <div class="mb-6">
            <div class="flex justify-between items-center mb-2">
                <label for="password"
                       class="text-sm font-medium text-slate-700">
                    Password
                </label>

                <a href="forgotPassword.html"
                   class="text-sm text-blue-600 hover:text-blue-700">
                    Forgot password?
                </a>
            </div>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
                class="w-full px-4 py-3 rounded-lg border border-slate-300 bg-slate-50 text-slate-900 placeholder:text-slate-400 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition"
            />
        </div>

        <!-- Sign In Button -->
        <button
            type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition-colors cursor-pointer focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600"
        >
            Sign In
        </button>

        <!-- Sign Up -->
        <p class="text-center text-sm text-slate-500 mt-6">
            Don't have an account?

            <a href="signUp.html"
               class="text-blue-600 font-semibold hover:underline">
                Sign Up
            </a>
        </p>

    </form>

</body>
</html>
